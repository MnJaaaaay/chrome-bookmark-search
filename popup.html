<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="appTitle">书签搜索</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Switch language">EN</button>
    <h1 data-i18n="appTitle">书签搜索</h1>

    <!-- 搜索类型选择 -->
    <div class="search-type-selector">
      <label><input type="radio" id="bookmark-radio" name="search-source" value="bookmarks" checked> <span data-i18n="sourceBookmarks">书签</span></label>
      <label><input type="radio" id="history-radio" name="search-source" value="history"> <span data-i18n="sourceHistory">历史记录</span></label>
      <label><input type="radio" id="clipboard-radio" name="search-source" value="clipboard"> <span data-i18n="sourceClipboard">剪贴板</span></label>
      <label><input type="radio" id="favorites-radio" name="search-source" value="favorites"> <span data-i18n="sourceFavorites">常用</span></label>
    </div>

    <!-- 搜索栏 -->
    <div class="search-container">
      <input type="text" id="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="搜索书签或历史记录..." />
    </div>

    <!-- 剪贴板控制按钮 -->
    <div id="clipboard-controls" class="clipboard-controls" style="display: none;">
      <button id="clear-clipboard-btn" class="control-btn" data-i18n="clearHistory">清空历史</button>
    </div>

    <!-- 常用片段控制按钮 -->
    <div id="favorites-controls" class="favorites-controls" style="display: none;">
      <button id="add-favorite-btn" class="control-btn" data-i18n="addNew">+ 新建</button>
    </div>

    <!-- 搜索结果区域 -->
    <div class="results-container">
      <div id="search-results" class="search-results"></div>
    </div>

    <!-- 编辑常用片段对话框 -->
    <div id="edit-dialog" class="dialog-overlay" style="display: none;">
      <div class="dialog-content">
        <h3 id="dialog-title" data-i18n="dialogNew">新建常用片段</h3>
        <div class="form-group">
          <label for="favorite-title" data-i18n="labelTitle">标题：</label>
          <input type="text" id="favorite-title" data-i18n-placeholder="placeholderTitle" placeholder="输入标题（可选）" />
        </div>
        <div class="form-group">
          <label for="favorite-content" data-i18n="labelContent">内容：</label>
          <textarea id="favorite-content" rows="6" data-i18n-placeholder="placeholderContent" placeholder="输入内容"></textarea>
        </div>
        <div class="dialog-buttons">
          <button id="save-favorite-btn" class="btn-primary" data-i18n="save">保存</button>
          <button id="cancel-favorite-btn" class="btn-secondary" data-i18n="cancel">取消</button>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
